<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Social Spark</title>
    <style>
        :root {
            --primary-green: #2ecc71;
            --dark-navy: #2c3e50;
            --light-bg: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background-color: var(--light-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .form-container {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 550px;
        }

        h2 { color: var(--primary-green); margin-bottom: 10px; text-align: center; font-weight: 800; }
        p { text-align: center; color: #64748b; margin-bottom: 30px; font-size: 0.9rem; }

        .form-group { margin-bottom: 20px; }

        label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--dark-navy); font-size: 0.9rem; }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #edf2f7;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus, textarea:focus { border-color: var(--primary-green); }

        /* Custom styling for the file upload field */
        input[type="file"] {
            padding: 8px;
            background: #fdfdfd;
            cursor: pointer;
            font-size: 0.9rem;
        }

        input[type="file"]::file-selector-button {
            background: var(--primary-green);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            margin-right: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        input[type="file"]::file-selector-button:hover {
            background: #27ae60;
        }

        .radio-group { display: flex; gap: 25px; padding: 10px 5px; }
        .radio-option { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; cursor: pointer; }
        .radio-option input { width: auto; cursor: pointer; }

        .btn-submit {
            background: var(--primary-green);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
            box-shadow: 0 8px 15px rgba(46, 204, 113, 0.2);
        }

        .btn-submit:hover { background: #27ae60; transform: translateY(-2px); }

        .back-link { display: block; text-align: center; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Join the Squad</h2>
        <p>Complete the form below to start your journey with Social Spark.</p>
        
        <form action="#" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label>Desired Role</label>
                <select required>
                    <option value="" disabled selected>Select a role</option>
                    <option value="web">Junior Web Developer</option>
                    <option value="ui">UI/UX Designer</option>
                    <option value="impact">Impact Analyst</option>
                </select>
            </div>

            <div class="form-group">
                <label>Key Skills</label>
                <textarea rows="2" placeholder="e.g., Python, Figma, Leadership"></textarea>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <div class="radio-group">
                    <label class="radio-option"><input type="radio" name="gender" value="male"> Male</label>
                    <label class="radio-option"><input type="radio" name="gender" value="female"> Female</label>
                    <label class="radio-option"><input type="radio" name="gender" value="other"> Other</label>
                </div>
            </div>

            <div style="display: flex; gap: 20px;">
                <div class="form-group" style="flex: 1;">
                    <label>Date of Birth</label>
                    <input type="date" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>City</label>
                    <input type="text" placeholder="e.g., Bangalore" required>
                </div>
            </div>

            <div class="form-group">
                <label>Upload Resume (PDF/DOCX)</label>
                <input type="file" name="resume" accept=".pdf,.doc,.docx" required>
            </div>

            <button type="submit" class="btn-submit">Submit Application</button>
            <a href="about.html" class="back-link">← Back to About Us</a>
        </form>
    </div>

</body>
</html>
